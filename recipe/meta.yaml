{% set name = "condeltri" %}
{% set version = "0.0.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/condeltri-{{ version }}.tar.gz
  sha256: 358abc8be3de732013b729a9c5d97b9cd227591ffdc1b5c7fd79bdecb507407b

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
    - cmake
    - make
  host:
    - python
    - scikit-build-core
    - pybind11
    - pip
  run:
    - python
    - numpy

test:
  imports:
    - condeltri
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/mdealencar/PythonCDT
  summary: Constrained Delaunay Triangulation
  license: MPL-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - mdealencar
    - simutisernestas
